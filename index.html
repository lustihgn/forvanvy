<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />

<title>Particle Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000208}
canvas{display:block;width:100%;height:100%;touch-action:none;filter:brightness(1.08)}
.greeting-label{position:fixed;z-index:1;left:0;top:0;opacity:0;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;font-family:"Dancing Script","Segoe Script","Brush Script MT",cursive;font-weight:700;font-style:normal;will-change:transform,opacity,filter}
.gl-base{display:block;color:#eadcff;background:linear-gradient(110deg,#f2eaff 8%,#d3a0ff 42%,#a894ff 68%,#9180ff 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:.45px rgba(231,215,255,.8);text-shadow:0 0 7px rgba(211,151,255,.78),0 0 17px rgba(145,128,255,.62)}
.gl-shine{position:absolute;left:0;top:0;display:block;color:transparent;-webkit-text-fill-color:transparent;background-image:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;background-repeat:no-repeat;background-position:100% 0;-webkit-background-clip:text;background-clip:text;opacity:0}
.wish-modal{position:fixed;inset:0;z-index:2;display:grid;place-items:center;padding:22px;background:rgba(2,5,20,.72);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .35s cubic-bezier(.22,.8,.24,1),visibility .35s}
.wish-modal.open{opacity:1;visibility:visible}
 .wish-card{position:relative;width:min(360px,100%);max-height:calc(100dvh - 44px);overflow-y:auto;border:1px solid rgba(255,177,224,.58);border-radius:26px;color:#fff2fa;text-align:center;background:radial-gradient(ellipse at 50% 0,rgba(168,111,213,.2),transparent 48%),linear-gradient(155deg,#291943,#10152d 68%,#281332);box-shadow:inset 0 0 0 3px rgba(255,255,255,.025),inset 0 0 32px rgba(201,133,255,.08),0 18px 70px rgba(255,66,176,.3);opacity:0;transform:translateY(22px) scale(.94);transition:transform .5s cubic-bezier(.22,1,.36,1),opacity .35s ease;will-change:transform,opacity}
.wish-card::before{position:absolute;inset:6px;border:1px solid rgba(235,196,255,.14);border-radius:20px;content:"";pointer-events:none}
.wish-modal.open .wish-card{opacity:1;transform:none}
.wish-close{position:absolute;z-index:1;top:11px;right:12px;width:36px;height:36px;border:1px solid rgba(255,255,255,.35);border-radius:50%;color:#fff;background:rgba(9,8,27,.55);font:24px/1 Arial,sans-serif;cursor:pointer;transition:transform .25s ease,background .25s ease}
.wish-close:hover{transform:rotate(90deg);background:rgba(9,8,27,.8)}
 .memory-frame{position:relative;display:grid;width:100%;height:auto;place-items:center;box-sizing:border-box;padding:11px;border:1px solid rgba(255,190,226,.58);border-radius:22px;background:radial-gradient(ellipse at 50% 0,rgba(255,175,225,.2),transparent 58%),linear-gradient(145deg,#30204b,#130d2b 70%,#271333);box-shadow:inset 0 0 0 3px rgba(255,255,255,.025),inset 0 0 22px rgba(211,151,255,.12),0 10px 34px rgba(193,110,220,.2)}
.memory-frame::before{position:absolute;inset:5px;border:1px solid rgba(235,196,255,.2);border-radius:16px;background:linear-gradient(90deg,#ffd7f2 0 12px,transparent 12px) left top/16px 1px no-repeat,linear-gradient(#ffd7f2 0 12px,transparent 12px) left top/1px 16px no-repeat,linear-gradient(270deg,#ffd7f2 0 12px,transparent 12px) right top/16px 1px no-repeat,linear-gradient(#ffd7f2 0 12px,transparent 12px) right top/1px 16px no-repeat,linear-gradient(90deg,#ffd7f2 0 12px,transparent 12px) left bottom/16px 1px no-repeat,linear-gradient(0deg,#ffd7f2 0 12px,transparent 12px) left bottom/1px 16px no-repeat,linear-gradient(270deg,#ffd7f2 0 12px,transparent 12px) right bottom/16px 1px no-repeat,linear-gradient(0deg,#ffd7f2 0 12px,transparent 12px) right bottom/1px 16px no-repeat;content:"";pointer-events:none}
.memory-frame.no-photo{display:none}
.memory-image{position:relative;z-index:1;display:block;width:100%;height:auto;max-width:100%;max-height:min(60dvh,480px);box-sizing:border-box;object-fit:contain;filter:none;opacity:1;border:1px solid rgba(255,226,246,.22);border-radius:13px;box-shadow:0 5px 18px rgba(0,0,0,.32)}
.wish-content{position:relative;z-index:1}
.memory-nav{position:absolute;top:50%;display:grid;width:36px;height:36px;place-items:center;transform:translateY(-50%);border:1px solid rgba(255,255,255,.5);border-radius:50%;color:#fff;background:rgba(12,8,31,.7);font:24px/1 Arial,sans-serif;cursor:pointer}
.memory-nav:hover{background:rgba(12,8,31,.95)}
.memory-prev{left:16px}
.memory-next{right:16px}
.memory-counter{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);padding:4px 9px;border-radius:12px;color:#fff;background:rgba(12,8,31,.72);font:12px Arial,sans-serif}
 .wish-content{position:relative;margin:0 18px 20px;padding:20px 18px 22px;border:1px solid rgba(255,177,224,.6);border-radius:21px;background:radial-gradient(ellipse at 50% 0,rgba(255,198,230,.13),transparent 68%),linear-gradient(145deg,rgba(255,198,230,.09),rgba(161,119,224,.12));box-shadow:inset 0 0 0 3px rgba(255,255,255,.025),inset 0 0 24px rgba(255,165,220,.09),0 9px 28px rgba(0,0,0,.25)}
.wish-content::before{position:absolute;inset:6px;border:1px solid rgba(255,210,239,.16);border-radius:15px;content:"";pointer-events:none}
.wish-content h2,.wish-content .wish-selected,.wish-content .wish-message{opacity:0;transform:translateY(6px);transition:opacity .18s ease,transform .18s ease}
.wish-modal.open .wish-content h2,.wish-modal.open .wish-content .wish-selected,.wish-modal.open .wish-content .wish-message{opacity:1;transform:none;transition-delay:0s}
 .wish-content h2{margin:0 0 11px;color:#ffd0ea;font:600 16px Arial,sans-serif;text-shadow:0 0 13px rgba(255,143,207,.35)}
.wish-content h2::before{display:block;margin:0 auto 5px;color:#ffc9e8;content:"✧ ･ﾟ: *✧* :ﾟ･ ✧";font:12px/1 Arial,sans-serif;letter-spacing:2px;text-shadow:0 0 10px rgba(255,143,207,.8)}
.wish-content h2::after{display:block;width:70px;height:1px;margin:9px auto 0;background:linear-gradient(90deg,transparent,rgba(255,196,230,.8),#fff1fb,rgba(255,196,230,.8),transparent);box-shadow:0 0 8px rgba(255,160,220,.45);content:""}
.wish-selected{margin:0 0 10px;color:#fff;font:600 13.6px Arial,sans-serif}
.wish-message{margin:0;color:#e8dcf3;font:12px/1.6 Arial,sans-serif}
@media(prefers-reduced-motion:reduce){.memory-image,.memory-frame,.wish-modal,.wish-card,.wish-content h2,.wish-content .wish-selected,.wish-content .wish-message{transition:none}}
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<div class="greeting-label" id="greetingLabel" aria-hidden="true">Happy 20-10</div>
<audio id="backgroundMusic" src="music.mp3" preload="auto" loop></audio>
<div class="wish-modal" id="wishModal" aria-hidden="true">
  <section class="wish-card" role="dialog" aria-modal="true" aria-labelledby="wishTitle">
    <button class="wish-close" id="wishClose" type="button" aria-label="Đóng">×</button>
    <div class="memory-frame no-photo" aria-label="Thư viện ảnh kỷ niệm"></div>
    <div class="wish-content">
      <h2 id="wishTitle">Một lời nhắn dành cho bạn</h2>
      <p class="wish-selected" id="wishSelected"></p>
      <p class="wish-message" id="wishMessage"></p>
    </div>
  </section>
</div>
<script>
const canvas=document.getElementById("heartCanvas"),ctx=canvas.getContext("2d",{alpha:false});
const SCRIPT_FONT='"Dancing Script","Segoe Script","Snell Roundhand","Brush Script MT",cursive';
/* Khi font tải xong thì vẽ lại sprite chữ (sprite được cache nên chỉ tạo 1 lần) */
if(document.fonts&&document.fonts.load){document.fonts.load('600 40px "Dancing Script"').then(()=>wishSprites.clear()).catch(()=>{})}

/* ---- Nhạc: iOS chỉ chấp nhận play() trong touchend/click ---- */
const music=document.getElementById("backgroundMusic");
let musicStarted=false;
function startMusic(){
  if(musicStarted)return;
  music.volume=0;
  music.play().then(()=>{
    musicStarted=true;
    const t0=performance.now();
    (function fade(){
      const k=Math.min(1,(performance.now()-t0)/2500);
      music.volume=.7*k*k*(3-2*k);
      if(k<1)requestAnimationFrame(fade);
    })();
  }).catch(()=>{});
}
["pointerup","touchend","click","keydown"].forEach(e=>document.addEventListener(e,startMusic,{passive:true}));

let seed=20241020;
function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}

const particles=[],ringParticles=[],outerRingParticles=[],sphereDecorations=[],wishHitTargets=[];
let ringDraw=[],outerDraw=[];   // danh sách hạt vành đai đã cắt theo chất lượng & sắp theo màu (đỡ đổi fillStyle liên tục)
const particleCount=7000,ringCount=2250,outerRingCount=800,decorCount=300;
const RING_TILT=-.2,RING_BANDS=[[0,.26,.34],[.32,.6,.36],[.66,.7,.08],[.76,1,.22]];
const RING_STOPS=[[255,205,222],[224,157,255],[142,190,255]];
let pLimit=particleCount,rLimit=ringCount,oLimit=outerRingCount,sizeComp=1;
let shadowEnabled=false;   // shadowBlur rất nặng trên GPU điện thoại → tắt hẳn
let lastFrameTime=0,hiddenAt=null,width=0,height=0,pixelRatio=1;
let animationStartTime=null,transitionStartTime=null,greetingDismissTime=null;
let cameraYaw=0,cameraPitch=0,targetCameraYaw=0,targetCameraPitch=0;
let inertiaYaw=0,inertiaPitch=0,velYaw=0,velPitch=0,lastMoveTime=0;
let sphereSpinAngle=0,sphereZoom=1,targetSphereZoom=1;
let dragPointer=null,pinchStartDistance=0,pinchStartZoom=1,wasPinching=false,lastInteractionTime=0;
let animClock=0,transClock=-1;
let dtS=16.7;
const activePointers=new Map();
const floaters=[],shooters=[],ripples=[];
let nextShooter=4500,spawnAcc=0,frameTime=0;
const FLOAT_RGB=[[255,190,235],[210,170,255],[255,255,255],[150,180,255]];

const stars=Array.from({length:270},()=>({x:(random()-.5)*4.8,y:(random()-.5)*3.2,z:(random()-.5)*4.8,radius:.3+random()*.64,opacity:.35+random()*.4,tw:random()*Math.PI*2,drift:.000015+random()*.000035}));
const projectedStars=stars.map(star=>({star,x:0,y:0,radius:0,a:0,depth:1}));

const extraWishes=["Mong hôm nay mang đến cho bạn thật nhiều điều dịu dàng.","Dù ngày dài đến đâu, hãy nhớ bạn luôn xứng đáng được yêu thương.","Chúc mỗi ước mơ của bạn đều tìm được đường thành hiện thực.","Mong bạn luôn gặp những người khiến trái tim mình bình yên.","Hãy giữ nụ cười nhé — nó làm thế giới này sáng hơn nhiều.","Chúc bạn có thật nhiều khoảnh khắc nhỏ mà vui thật lâu.","Bạn đặc biệt hơn bạn nghĩ, và được thương nhiều hơn bạn biết.","Mong mọi điều tốt đẹp sẽ nhẹ nhàng tìm đến bên bạn.","Chúc bạn luôn đủ mạnh mẽ để theo đuổi điều mình yêu.","Mong những ngày bình thường cũng đem đến niềm vui thật đẹp.","Chúc trái tim bạn luôn ấm áp và bình yên.","Mỗi ngày mới là một cơ hội để bắt đầu điều tuyệt vời.","Mong bạn luôn tự hào về chính mình, dù chỉ là một bước nhỏ.","Chúc mọi cố gắng của bạn sớm nở thành quả ngọt.","Mong bạn gặp thật nhiều bất ngờ khiến mình mỉm cười.","Hãy tin rằng những điều tốt đẹp đang trên đường tìm đến bạn.","Chúc bạn luôn được lắng nghe, thấu hiểu và trân trọng.","Mong thanh xuân của bạn ngập tràn những kỷ niệm đáng nhớ.","Chúc bạn ngủ ngon, thức dậy vui và luôn có điều để mong chờ.","Dù ở đâu, mong bạn luôn tìm thấy một nơi gọi là bình yên."];
const sphereWishes=["Luôn hạnh phúc","Mãi yêu thương","Bình an nhé","Luôn mỉm cười","May mắn mỗi ngày","Mãi bên nhau","Tràn đầy niềm vui","Yêu bạn nhiều","Mọi điều như ý","Ngọt ngào nhé","Thật nhiều yêu thương","Hạnh phúc dài lâu","Luôn rạng rỡ","Ước mơ thành hiện thực","Ấm áp mỗi ngày","Thương thật nhiều","Một đời bình yên","Niềm vui bất tận","Luôn được chở che","Mãi lung linh","Ngày mới thật vui","Luôn gặp điều tốt lành","Tự tin tỏa sáng","Bình yên trong tim","Mong bạn luôn được yêu","Nụ cười luôn nở","Ước mơ bay cao","Hạnh phúc quanh đây","Tỏa sáng theo cách riêng","Thành công rực rỡ","Mỗi ngày một niềm vui","Luôn vững tin nhé","Thật nhiều may mắn","Yêu đời và an yên","Mong điều lành ghé thăm","Rạng rỡ mỗi ngày","Luôn có người bên cạnh","Trái tim ngập nắng","Vạn điều như ý","Hạnh phúc nhé bạn","Luôn dịu dàng với mình","Thành công trên con đường bạn chọn","Mong nắng luôn ở trong tim","Hãy cứ là chính bạn","Bình yên sẽ tìm đến","Thêm một ngày thật đáng yêu","Mọi nỗ lực đều xứng đáng","Luôn được yêu thương","Rực rỡ theo cách riêng","Niềm vui ở quanh đây","Chúc bạn luôn an nhiên","Cùng nhau tạo kỷ niệm đẹp","Tương lai thật tươi sáng","Luôn tin vào điều kỳ diệu","Bạn xứng đáng với điều tốt nhất","Hạnh phúc từ những điều nhỏ","Mong ước mơ hóa thành sự thật","Mỗi ngày đều có phép màu","Trái tim luôn đầy hy vọng","Cười thật tươi nhé"];
const SPHERE_RADIUS=72,RING_SQUASH=.2,RING_Y_OFFSET=4;
const PALETTE={center:[239,205,255],edge:[139,121,255]};

/* ---- Thẻ lời nhắn ---- */
const wishModal=document.getElementById("wishModal");
const memoryFrame=document.querySelector(".memory-frame");
const imageCount=12;
const preloadedMemoryImages=Array.from({length:imageCount},(_,i)=>{
  const image=new Image();
  image.src=`anh${i+1}.jpg`;
  return image;
});
let imageRequestId=0,modalOpen=false,nextMemoryPhotoIndex=0;
let memoryImagesReady=false,settledMemoryImages=0;
const settledMemoryImageSet=new WeakSet();
function showNextMemoryPhoto(){
  const available=preloadedMemoryImages.map((image,index)=>({image,index})).filter(entry=>entry.image.naturalWidth>0);
  memoryFrame.replaceChildren();
  if(!available.length){memoryFrame.classList.add("no-photo");return}
  const photo=available[nextMemoryPhotoIndex%available.length];
  nextMemoryPhotoIndex=(nextMemoryPhotoIndex+1)%available.length;
  const image=document.createElement("img");
  image.className="memory-image";
  image.alt=`Ảnh kỷ niệm ${photo.index+1}`;
  image.src=photo.image.src;
  memoryFrame.classList.remove("no-photo");
  memoryFrame.appendChild(image);
}
function memoryImageSettled(image){
  if(settledMemoryImageSet.has(image))return;
  settledMemoryImageSet.add(image);
  settledMemoryImages++;
  if(settledMemoryImages===preloadedMemoryImages.length){
    memoryImagesReady=true;
    if(modalOpen)showNextMemoryPhoto();
  }
}
preloadedMemoryImages.forEach(image=>{
  image.addEventListener("load",()=>memoryImageSettled(image),{once:true});
  image.addEventListener("error",()=>memoryImageSettled(image),{once:true});
  if(image.complete)memoryImageSettled(image);
});
function openWish(item){
  ++imageRequestId;
  document.getElementById("wishSelected").textContent=item.wish;
  document.getElementById("wishMessage").textContent=extraWishes[Math.abs(item.index)%extraWishes.length];
  wishModal.classList.add("open");
  wishModal.setAttribute("aria-hidden","false");
  modalOpen=true;

  if(memoryImagesReady)showNextMemoryPhoto();
}
function closeWish(){
  imageRequestId++;
  modalOpen=false;
  wishModal.classList.remove("open");
  wishModal.setAttribute("aria-hidden","true");
}

const clamp01=t=>Math.max(0,Math.min(1,t));
const ease=t=>t*t*(3-2*t);
const smooth=t=>{t=clamp01(t);return t*t*(3-2*t)};
const smoother=t=>{t=clamp01(t);return t*t*t*(t*(t*6-15)+10)};

/* ---- Biểu tượng tự vẽ ---- */
function fillSparkle(x,y,r){
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*.28:r,px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();ctx.fill();
}
function fillHeart(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x,y+s*.5);
  ctx.bezierCurveTo(x-s*1.1,y-s*.1,x-s*.55,y-s*.75,x,y-s*.3);
  ctx.bezierCurveTo(x+s*.55,y-s*.75,x+s*1.1,y-s*.1,x,y+s*.5);
  ctx.fill();
}
const BUTTERFLY_PALETTES=[["#fff3fb","#ffc2e8","#e37fc2"],["#f6f0ff","#cdb8ff","#9575ee"],["#effcff","#b9e8ff","#7ab2f4"]];
const BUTTERFLY_SCALE=.6;   // kích thước con bướm (1 = cỡ cũ). Muốn nhỏ hơn nữa thì giảm số này
const BF_RES=2,BF_W=48,BF_H=40,BF_FRAMES=10;
const butterflySprites=[];
function bakeButterfly(pal,flap){
  const c=document.createElement("canvas");c.width=BF_W*BF_RES;c.height=BF_H*BF_RES;
  const g=c.getContext("2d"),P=BUTTERFLY_PALETTES[pal];
  g.setTransform(BF_RES,0,0,BF_RES,BF_W/2*BF_RES,BF_H/2*BF_RES);
  const grad=g.createLinearGradient(-21,-15,0,5);
  grad.addColorStop(0,P[0]);grad.addColorStop(.5,P[1]);grad.addColorStop(1,P[2]);
  for(const side of[-1,1]){
    g.save();g.scale(side*flap,1);
    g.fillStyle=grad;g.strokeStyle="rgba(255,255,255,.68)";g.lineWidth=.7;g.lineJoin="round";
    g.beginPath();g.moveTo(-.7,-1.2);
    g.bezierCurveTo(-5,-7,-8,-18,-17,-17);
    g.bezierCurveTo(-22,-16,-21,-8,-17,-3);
    g.bezierCurveTo(-13,1,-6,1,-.7,.8);
    g.closePath();g.fill();g.stroke();
    g.beginPath();g.moveTo(-.7,.8);
    g.bezierCurveTo(-7,1,-12,1,-16,5);
    g.bezierCurveTo(-19,9,-14,15,-10,14);
    g.bezierCurveTo(-6,13,-3,7,-.4,2.2);
    g.closePath();g.fill();g.stroke();
    g.strokeStyle="rgba(255,255,255,.48)";g.lineWidth=.42;
    g.beginPath();g.moveTo(-1,0);g.quadraticCurveTo(-10,-8,-18,-14);
    g.moveTo(-2,0);g.quadraticCurveTo(-11,-3,-19,-6);
    g.moveTo(-1,2);g.quadraticCurveTo(-9,7,-15,12);g.stroke();
    g.fillStyle="rgba(255,255,255,.88)";
    g.beginPath();g.arc(-16,-12,1.7,0,Math.PI*2);g.fill();
    g.beginPath();g.arc(-14,9,1.25,0,Math.PI*2);g.fill();
    g.restore();
  }
  g.fillStyle="#4a2a58";g.beginPath();g.ellipse(0,.5,1.1,5,0,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(0,-4.7,1.25,0,Math.PI*2);g.fill();
  g.strokeStyle="#4a2a58";g.lineWidth=.6;g.lineCap="round";g.beginPath();
  g.moveTo(-.4,-5.6);g.quadraticCurveTo(-3,-9,-5,-8.4);g.moveTo(.4,-5.6);g.quadraticCurveTo(3,-9,5,-8.4);
  g.stroke();
  return c;
}
function starPathG(g,R,inner){
  g.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?R*inner:R;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
  g.closePath();
}
const STAR_R=14;
let starSprite=null,heartDecoSprite=null;
function bakeStar(){
  const c=document.createElement("canvas");c.width=c.height=64;
  const g=c.getContext("2d");g.setTransform(2,0,0,2,32,32);
  const gr=g.createRadialGradient(0,0,0,0,0,STAR_R);

/* ---- Tạo hạt ---- */
function heart(t){return{x:16*Math.sin(t)**3,y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))}}

let heartCDF=null;
function buildHeartCDF(){
  const N=2048,cum=new Float32Array(N+1);

  gr.addColorStop(.28,`rgba(${r},${g},${b},.9)`);

function createSphereDecorations(count){

  const points=Array.from({length:count},(_,i)=>{

  });

function updateSpin(){

const sphereList=[],spherePool=[];

  g.globalCompositeOperation="lighter";
  for(let i=0;i<n;i++){
    const p=list[i],sA=p.sA;
    if(backPass!==(sA<0))continue;
    const lx=p.cA*p.radius*scale,ly=(sA*p.radius*RING_SQUASH+p.lift)*scale;
    const x=cx+lx*ct-ly*st,y=oy+lx*st+ly*ct;
    const depthFade=backPass?.12+.88*smooth(sA+1):.72+.28*smooth((sA+.3)/.6);
    const tw=p.star?.65+.35*Math.sin(time*.004+p.tw):.94;
    const alpha=Math.min(1,Math.max(minOp,p.opacity)*visible*depthFade*tw*1.12);
    const r=Math.max(.45,p.size*scale*sizeComp);
    if(p.color!==lastColor){g.fillStyle=p.color;lastColor=p.color}
    if(p.star){
      g.globalAlpha=alpha*.28;g.beginPath();g.arc(x,y,r*3.4,0,TAU);g.fill();
      g.globalAlpha=alpha;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
    }else{
      g.globalAlpha=alpha;
      if(r<1.5)g.fillRect(x-r,y-r,r*2,r*2);
      else{g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
    }
  }
  g.globalCompositeOperation="source-over";g.globalAlpha=1;
}

/* Vành đai vẽ vào 2 lớp phụ (nửa sau / nửa trước), chỉ cập nhật ~30 lần/giây (vành đai quay rất chậm);
   các khung còn lại chỉ drawImage */
let ringLayers=null,ringCap=0,ringLScale=0,ringLVis=-1,ringLTime=-1e9;
function ensureRingLayers(ringScale,ringVisible,time){
  const px=pixelRatio;
  if(ringLayers&&ringLayers.px===px&&Math.abs(ringScale-ringLScale)<ringScale*.004&&Math.abs(ringVisible-ringLVis)<.01&&time-ringLTime<20)return;
  const need=Math.ceil(2*54*ringScale);
  if(!ringLayers||need>ringCap||ringLayers.px!==px){
    ringCap=Math.ceil(need*1.2);
    const mk=()=>{const c=document.createElement("canvas");c.width=Math.ceil(ringCap*px);c.height=Math.ceil(ringCap*px);const g=c.getContext("2d");g.setTransform(px,0,0,px,0,0);return{c,g}};
    ringLayers={back:mk(),front:mk(),px};
  }
  ringLScale=ringScale;ringLVis=ringVisible;ringLTime=time;
  updateRing(outerDraw,time);updateRing(ringDraw,time);
  const h=ringCap/2;
  for(const back of[true,false]){
    const L=back?ringLayers.back:ringLayers.front;
    L.g.clearRect(0,0,ringCap,ringCap);
    drawRingPass(L.g,h,h,ringScale,ringVisible,time,back,outerDraw);
    drawRingPass(L.g,h,h,ringScale,ringVisible,time,back,ringDraw);
  }
}
function drawRingLayer(cx,cy,back){
  const L=back?ringLayers.back:ringLayers.front;
  ctx.globalCompositeOperation="lighter";ctx.globalAlpha=back?.72:1;
  ctx.drawImage(L.c,cx-ringCap/2,cy-ringCap/2,ringCap,ringCap);
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
}

/* ---- Lời chúc: blur-in + thu khoảng cách chữ, vệt sáng quét ngang, tự hiện & tự tan theo chu kỳ ---- */
const greetingLabel=document.getElementById("greetingLabel");
const GREET_TEXT="Happy 20-10";
greetingLabel.textContent="";
const glBase=document.createElement("span");glBase.className="gl-base";glBase.textContent=GREET_TEXT;
const glShine=document.createElement("span");glShine.className="gl-shine";glShine.setAttribute("aria-hidden","true");glShine.textContent=GREET_TEXT;
greetingLabel.append(glBase,glShine);
function drawGreeting(cx,cy,anchorScale,exitT,buildT,time){
  const inP=smoother(buildT),outP=smoother(exitT);
  const vis=inP*(1-outP);
  const st=greetingLabel.style;
  if(vis<=.002){st.opacity="0";glShine.style.opacity="0";return}
  const fs=Math.min(56,Math.max(26,width*.09))*.9*.9;
  const float=Math.sin(time*.0016)*fs*.04*vis;
  const y=(1-inP)*fs*.35-outP*fs*.6+float;
  const sc=.92+.08*inP+.06*outP;
  const blur=(1-inP)*4+outP*5;
  const glow=.75+.25*Math.sin(time*.002);
  st.left=`${cx}px`;
  st.top=`${cy-anchorScale*20-fs*1.6}px`;
  st.fontSize=`${fs}px`;
  st.letterSpacing=`${(1-inP)*.3+outP*.25}em`;
  st.opacity=vis;
  st.transform=`translate(-50%,-50%) translate3d(0,${y}px,0) scale(${sc})`;
  st.filter=blur>.05?`blur(${blur}px)`:"none";
  glBase.style.textShadow=`0 0 ${7+4*glow}px rgba(211,151,255,${.76+.18*glow}),0 0 ${17+10*glow}px rgba(145,128,255,${.58+.25*glow})`;
  // vệt sáng: chỉ chạy khi chữ đã hiện đủ, cứ ~5 giây quét 1 lần từ trái sang phải
  const q=((time%5200)/1500);
  if(inP>.98&&outP<.05&&q<1){
    glShine.style.opacity="1";
    glShine.style.backgroundPosition=`${(1-smoother(q))*100}% 0`;
  }else glShine.style.opacity="0";
}

/* ---- Hiệu ứng nâng cao ---- */
function spawnFloater(x,y,vx,vy,life,size,drag){
  if(floaters.length>=60)floaters.shift();
  floaters.push({x,y,vx,vy,age:0,life,size,drag,rgb:FLOAT_RGB[(Math.random()*FLOAT_RGB.length)|0],tw:Math.random()*6.283});
}
/* Quầng sáng: dùng sprite gradient tạo sẵn thay vì tạo gradient mới mỗi khung */
const glowSprites=new Map();
function glowSprite(r,g,b){
  const k=r+","+g+","+b;
  let c=glowSprites.get(k);
  if(c)return c;
  c=document.createElement("canvas");c.width=c.height=128;
  const x=c.getContext("2d"),gr=x.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,`rgba(${r},${g},${b},1)`);
  gr.addColorStop(.45,`rgba(${r},${g},${b},.35)`);
  gr.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=gr;x.fillRect(0,0,128,128);
  glowSprites.set(k,c);
  return c;
}
function drawGlow(cx,cy,radius,alpha,r,g,b){
  if(alpha<=.002||radius<=1)return;
  ctx.globalAlpha=Math.min(1,alpha);
  ctx.drawImage(glowSprite(r,g,b),cx-radius,cy-radius,radius*2,radius*2);
}
function drawFx(sec,time,cx,cy,heartScale,visible,grow){
  const TAU=Math.PI*2;
  spawnAcc+=8*visible*(1-.75*grow)*(quality===0?.4:1)*sec;
  while(spawnAcc>=1){
    spawnAcc--;
    const p=heart(randomHeartT()),k=1.02+Math.random()*.1;
    const x=cx+p.x*k*heartScale,y=cy+p.y*k*heartScale;
    let dx=x-cx,dy=y-cy;const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const sp=10+Math.random()*22;
    spawnFloater(x,y,dx*sp,dy*sp-8,1.8+Math.random()*1.8,.8+Math.random()*1.6,.4);
  }
  ctx.globalCompositeOperation="lighter";
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.age+=sec;
    if(f.age>=f.life){floaters.splice(i,1);continue}
    const damp=Math.exp(-f.drag*sec);f.vx*=damp;f.vy*=damp;f.x+=f.vx*sec;f.y+=f.vy*sec;
    const t=f.age/f.life,a=Math.max(0,Math.sin(Math.PI*Math.min(1,t*1.15)))*(.72+.28*Math.sin(time*.01+f.tw));
    const r=f.size*(1-.4*t);
    const d=r*6;
    ctx.globalAlpha=Math.min(1,a*1.1);ctx.drawImage(glowSprite(f.rgb[0],f.rgb[1],f.rgb[2]),f.x-d/2,f.y-d/2,d,d);
  }
  nextShooter-=sec*1000;
  if(nextShooter<=0&&visible>.9){
    nextShooter=8000+Math.random()*7000;
    const ang=(18+Math.random()*22)*Math.PI/180,dir=Math.random()<.5?1:-1;
    shooters.push({x:dir>0?Math.random()*width*.45:width-Math.random()*width*.45,y:Math.random()*height*.35,vx:Math.cos(ang)*dir,vy:Math.sin(ang),speed:520+Math.random()*300,age:0,life:.8+Math.random()*.4,len:90+Math.random()*80});
  }
  for(let i=shooters.length-1;i>=0;i--){
    const s=shooters[i];s.age+=sec;const t=s.age/s.life;
    if(t>=1){shooters.splice(i,1);continue}
    s.x+=s.vx*s.speed*sec;s.y+=s.vy*s.speed*sec;
    const a=Math.sin(Math.PI*t),tx=s.x-s.vx*s.len,ty=s.y-s.vy*s.len;
    const gr=ctx.createLinearGradient(tx,ty,s.x,s.y);
    gr.addColorStop(0,"rgba(158,188,255,0)");gr.addColorStop(1,`rgba(255,255,255,${.9*a})`);
    ctx.globalAlpha=1;ctx.strokeStyle=gr;ctx.lineWidth=1.6;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x,s.y);ctx.stroke();
    ctx.fillStyle="#fff";ctx.globalAlpha=a;ctx.beginPath();ctx.arc(s.x,s.y,1.6,0,TAU);ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];r.age+=sec*1000;const t=r.age/r.life;
    if(t>=1){ripples.splice(i,1);continue}
    const e=1-Math.pow(1-t,3);
    ctx.globalAlpha=(1-t)*.55;ctx.strokeStyle="#e4dcff";ctx.lineWidth=.6+2*(1-t);
    ctx.beginPath();ctx.arc(r.x,r.y,8+e*72,0,TAU);ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* ---- Kích thước & hiệu năng ---- */
let quality=2;   // 2 = đẹp nhất, 0 = nhẹ nhất; tự hạ dần nếu máy yếu (KHÔNG ảnh hưởng số hạt của trái tim)
function applyQuality(){
  pLimit=particleCount;   // trái tim luôn đủ hạt, không bị giảm theo chất lượng
  if(quality===2){rLimit=ringCount;oLimit=outerRingCount;sizeComp=1}
  else if(quality===1){rLimit=1000;oLimit=320;sizeComp=1.08}
  else{rLimit=550;oLimit=180;sizeComp=1.18}
  shadowEnabled=false;
  rebuildRingOrder();
  resize();
}
function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w||!h)return;
  const maxDpr=3;   // độ phân giải cao đồng đều trên mọi thiết bị
  pixelRatio=Math.min(Math.max(window.devicePixelRatio||1,2),maxDpr);
  width=w;height=h;
  canvas.width=Math.round(w*pixelRatio);canvas.height=Math.round(h*pixelRatio);
  ctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);
  buildBgCache();
}
/* Đo FPS: hạ chất lượng khi < ~45fps; đo lại từ đầu khi bắt đầu giai đoạn nặng */
let perfAcc=0,perfFrames=0,perfWarmup=45;
function resetPerf(warm){perfAcc=0;perfFrames=0;perfWarmup=warm}
function trackPerf(delta){
  if(delta>200)return;
  if(perfWarmup>0){perfWarmup--;return}
  perfAcc+=delta;
  if(++perfFrames<30)return;
  const avg=perfAcc/perfFrames;perfAcc=0;perfFrames=0;
  if(avg>22&&quality>0){quality--;applyQuality();perfWarmup=20}
}

/* ---- Vòng lặp chính ---- */
let skipFlip=0;
function draw(time){
  requestAnimationFrame(draw);
  if(modalOpen){lastFrameTime=0;return}   // thẻ đang mở, nền bị làm mờ: không cần vẽ lại
  if(quality===0&&(skipFlip^=1))return;   // mức thấp nhất: chạy 30fps ổn định thay vì dao động
  if(!width||!height)return;
  if(lastFrameTime===0)lastFrameTime=time;
  const rawDelta=time-lastFrameTime;lastFrameTime=time;
  trackPerf(rawDelta);
  dtS+=(Math.min(50,rawDelta)-dtS)*.12;
  const sec=dtS/1000,fScale=dtS/16.667;
  if(animationStartTime===null)animationStartTime=time;
  animClock+=dtS;if(transClock>=0)transClock+=dtS;
  const sinceStart=animClock;

  const visible=smoother(sinceStart/1800);
  const bgFade=smoother(sinceStart/1400);
  const retreat=transClock<0?0:smoother(transClock/3200);
  const heartZoom=2.2-1.26*retreat;
  const revealT=transClock<0?0:clamp01((transClock-700)/7000);
  const ringVisible=smoother(revealT/.75);
  const ringGrowth=transClock<0?0:smoother((transClock-200)/2400);
  const grow=smoother(revealT);
  const formBuild=Math.min(1.2,sinceStart/4200);
  // Chữ hiện một lần sau 4.2 giây, giữ nguyên đến khi người xem chạm/click màn hình.
  const greetBuild=clamp01((sinceStart-4200)/3200);
  const greetOut=greetingDismissTime===null?0:smoother((sinceStart-greetingDismissTime)/900);

  sphereSpinAngle+=.088*sec;
  sphereZoom+=(targetSphereZoom-sphereZoom)*(1-Math.exp(-7*sec));

  if(!dragPointer){
    const idle=smoother((time-lastInteractionTime-2500)/2500);
    targetCameraYaw+=.00028*fScale*idle;
    targetCameraYaw+=inertiaYaw*fScale;
    targetCameraPitch=Math.max(-1.1,Math.min(1.1,targetCameraPitch+inertiaPitch*fScale));
    const decay=Math.exp(-3.2*sec);inertiaYaw*=decay;inertiaPitch*=decay;
    if(Math.abs(inertiaYaw)<1e-5)inertiaYaw=0;
    if(Math.abs(inertiaPitch)<1e-5)inertiaPitch=0;
  }
  const re=1-Math.exp(-9*sec);
  cameraYaw+=(targetCameraYaw-cameraYaw)*re;cameraPitch+=(targetCameraPitch-cameraPitch)*re;

  drawSpaceBackground(time,bgFade);
  const cx=width/2,cy=height/2-height*.05;
  const beat=Math.pow(Math.max(0,Math.sin(time*.0021)),2)*.85+Math.pow(Math.max(0,Math.sin(time*.0021-.55)),2)*.35;
  const pulse=1+beat*.045*(1-.5*retreat);
  const scale=Math.min(width,height)*(width<=600?.038:.0135)*.5*.45;
  const zs=scale*sphereZoom*(.6+.4*grow),ringExpand=.015+.985*ringGrowth;
  const sphereScale=zs*1.2*1.3*.9*ringExpand;
  const ringScale=zs*ringExpand;
  const heartScale=scale*HEART_SIZE*1.18*1.2*.88*1.4*pulse*heartZoom,pulseExtra=(pulse-1)*.6;
  frameTime=time;
  ctx.globalCompositeOperation="lighter";
  drawGlow(cx,cy,heartScale*24,.025*visible*(1+beat*.7),135,85,255);
  drawGlow(cx,cy,sphereScale*SPHERE_RADIUS*1.02,.13*grow*ringVisible*(1-.35*retreat),190,120,255);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";
  if(ringVisible>0){
    updateSpin();
    drawSpherePass(cx,cy,sphereScale,time,true,revealT,retreat);
    ensureRingLayers(ringScale,ringVisible,time);
    drawRingLayer(cx,cy,true);
  }
  ctx.globalCompositeOperation="lighter";
  const pn=Math.min(particles.length,pLimit),forming=formBuild<1.2;
  let lastFill=null;   // chỉ gán fillStyle khi màu đổi (hạt đã sắp theo màu)
  for(let i=0;i<pn;i++){
    const p=particles[i];
    p.phase+=p.speed*fScale;
    const sparkle=(Math.sin(p.phase*1.7+time*.003)+1)*.16,twinkle=Math.max(0,Math.sin(p.phase*2.3+time*.005));
    const amp=.7+p.radius*6;
    const chX=Math.sin(time*.0016+p.phase*3.1)*amp,chY=Math.cos(time*.0013+p.phase*2.4)*amp;
    let x=p.x,y=p.y,arrive=1,sizeK=1;
    if(forming){
      const s=smoother((formBuild-(p.arrive-.4))/.6);
      if(s<1){
        x=p.startX+(p.x-p.startX)*s;y=p.startY+(p.y-p.startY)*s;
        const rot=p.swirl*(1-s),c=Math.cos(rot),sn=Math.sin(rot);
        const nx=x*c-y*sn,ny=x*sn+y*c;x=nx;y=ny;
        arrive=smoother(s*1.8);sizeK=.55+.45*smooth(s);
      }
    }
    const scatter=smoother(retreat);
    const particleFade=1;
    const centerDim=1-.72*smooth(1-Math.abs(x)/5)*smooth(1-Math.abs(y+1)/8);
    const al=Math.min(1,(p.opacity+sparkle+twinkle*.18)*visible*arrive*.32*particleFade*centerDim);
    ctx.globalAlpha=al;
    const spread=heartScale*.1*scatter,dir=Math.hypot(x,y)||1;
    const px=cx+(x+x*pulseExtra)*heartScale+chX+x/dir*spread,py=cy+(y+y*pulseExtra)*heartScale+chY+y/dir*spread;
    const minParticleRadius=.62*(1-.55*retreat);
    const pr=Math.max(minParticleRadius,p.radius*heartScale/HEART_SIZE*sizeK*(1+twinkle*.35));
    if(pr<.95){if(p.color!==lastFill){ctx.fillStyle=p.color;lastFill=p.color}ctx.fillRect(px-pr,py-pr,pr*2,pr*2)}
    else{const dd=pr*3.8;ctx.drawImage(heartSprites[p.si],px-dd/2,py-dd/2,dd,dd)}
    if(p.glint&&twinkle>.3&&arrive>.9){
      const L=pr*(3+7*twinkle),th=Math.max(.5,pr*.28);
      ctx.globalAlpha=al*.7*twinkle;ctx.fillStyle="#fff4fb";
      ctx.fillRect(px-L,py-th/2,L*2,th);ctx.fillRect(px-th/2,py-L,th,L*2);lastFill=null;
    }
  }
  ctx.globalCompositeOperation="source-over";
  if(ringVisible>0){
    drawRingLayer(cx,cy,false);
    drawSpherePass(cx,cy,sphereScale,time,false,revealT,retreat);
  }
  drawFx(sec,time,cx,cy,heartScale,visible,grow);
  const anchorScale=scale*HEART_SIZE*1.18*1.2*.88*1.4*2.2;   // cố định theo cỡ trái tim ban đầu → chữ không bị trượt
  drawGreeting(cx,cy,anchorScale,greetOut,greetBuild,time*1.1);
}

/* ---- Tương tác (chạm, kéo, zoom) ---- */
canvas.addEventListener("pointerdown",e=>{
  lastInteractionTime=performance.now();
  inertiaYaw=inertiaPitch=velYaw=velPitch=0;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size===2){
    const [a,b]=[...activePointers.values()];
    pinchStartDistance=Math.hypot(b.x-a.x,b.y-a.y);pinchStartZoom=targetSphereZoom;wasPinching=true;
  }
  dragPointer={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,startTime:performance.now(),moved:wasPinching};
  lastMoveTime=performance.now();
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
});
canvas.addEventListener("pointermove",e=>{
  if(activePointers.has(e.pointerId))activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePointers.size>=2){
    const [a,b]=[...activePointers.values()],d=Math.hypot(b.x-a.x,b.y-a.y);
    if(pinchStartDistance>0)targetSphereZoom=Math.max(.65,Math.min(1.8,pinchStartZoom*d/pinchStartDistance));
    if(dragPointer)dragPointer.moved=true;
    lastInteractionTime=performance.now();return;
  }
  if(!dragPointer||dragPointer.id!==e.pointerId)return;
  const now=performance.now();
  lastInteractionTime=now;
  if(Math.hypot(e.clientX-dragPointer.startX,e.clientY-dragPointer.startY)>8)dragPointer.moved=true;
  const dx=(e.clientX-dragPointer.x)*.006,dy=(e.clientY-dragPointer.y)*.006;
  targetCameraYaw+=dx;
  targetCameraPitch=Math.max(-1.1,Math.min(1.1,targetCameraPitch+dy));
  const dt=Math.max(4,now-lastMoveTime);lastMoveTime=now;
  velYaw=velYaw*.6+(dx/dt*16.667)*.4;velPitch=velPitch*.6+(dy/dt*16.667)*.4;
  dragPointer.x=e.clientX;dragPointer.y=e.clientY;
});
canvas.addEventListener("pointerup",e=>{
  activePointers.delete(e.pointerId);lastInteractionTime=performance.now();
  if(wasPinching){
    dragPointer=null;
    if(activePointers.size===0){wasPinching=false;pinchStartDistance=0}
    return;
  }
  if(!dragPointer||dragPointer.id!==e.pointerId)return;
  if(performance.now()-dragPointer.startTime>250)dragPointer.moved=true;
  if(!dragPointer.moved){
    if(greetingDismissTime===null)greetingDismissTime=animClock;
    if(transitionStartTime===null){
      transitionStartTime=performance.now();transClock=0;
      resetPerf(25);   // nhanh chóng đo và hạ tải hiệu ứng phụ nếu thiết bị chậm
    }else{
      const rect=canvas.getBoundingClientRect();
      const px=e.clientX-rect.left,py=e.clientY-rect.top;
      let best=null,bestD=Infinity;
      for(const t of wishHitTargets){const d=Math.hypot(px-t.x,py-t.y);if(d<t.radius&&d<bestD){best=t;bestD=d}}
      if(best)openWish(best);
    }
  }else if(performance.now()-lastMoveTime<90){
    inertiaYaw=Math.max(-.06,Math.min(.06,velYaw));
    inertiaPitch=Math.max(-.06,Math.min(.06,velPitch));
  }
  dragPointer=null;
});
canvas.addEventListener("pointercancel",e=>{
  activePointers.delete(e.pointerId);dragPointer=null;
  if(activePointers.size===0)wasPinching=false;
});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  targetSphereZoom=Math.max(.65,Math.min(1.8,targetSphereZoom*Math.exp(-e.deltaY*.001)));
  lastInteractionTime=performance.now();
},{passive:false});

/* ---- Tạm dừng khi tab bị ẩn ---- */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=performance.now();music.pause();return}
  if(musicStarted)music.play().catch(()=>{});
  if(hiddenAt===null)return;
  const paused=performance.now()-hiddenAt;
  if(animationStartTime!==null)animationStartTime+=paused;
  if(transitionStartTime!==null)transitionStartTime+=paused;
  lastInteractionTime+=paused;lastFrameTime=0;dtS=16.7;hiddenAt=null;
});
document.getElementById("wishClose").addEventListener("click",closeWish);
wishModal.addEventListener("click",e=>{if(e.target===wishModal)closeWish()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeWish()});

/* ---- Khởi động ---- */
resize();
createParticles(particleCount);createRing(ringCount);createOuterRing(outerRingCount);createSphereDecorations(decorCount);
rebuildRingOrder();bakeDecor();
new ResizeObserver(resize).observe(canvas);
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,250));
window.addEventListener("load",resize);
requestAnimationFrame(draw);
</script>
